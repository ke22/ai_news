name: Publish Latest Report to Notion

"on":
  workflow_dispatch:

jobs:
  publish-notion:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Taipei
      SITE_BASE_URL: https://ke22.github.io/ai_news
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest report to Notion
        run: python3 notion_sync.py
