name: Daily AI News

"on":
  schedule:
    # 23:15 UTC = 07:15 Asia/Taipei. Run before 08:00 TWN to absorb GitHub schedule delay.
    - cron: '15 23 * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TZ: Asia/Taipei
      SITE_BASE_URL: https://ke22.github.io/ai_news
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        run: python3 agent.py

      - name: Publish site
        run: python3 publish.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Daily update $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Publish to Notion
        run: python3 notion_publish.py
