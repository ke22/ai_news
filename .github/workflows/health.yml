name: Daily AI News Health

"on":
  schedule:
    # 02:30 UTC = 10:30 Asia/Taipei, after the normal publication window.
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei
      SITE_BASE_URL: https://ke22.github.io/ai_news

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine expected report date
        id: expected
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Check published report
        id: health
        continue-on-error: true
        run: |
          python3 health_check.py \
            --date "${{ steps.expected.outputs.date }}" \
            --attempts 3 \
            --delay-seconds 60

      - name: Update health issue
        uses: actions/github-script@v7
        env:
          REPORT_DATE: ${{ steps.expected.outputs.date }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const date = process.env.REPORT_DATE;
            const outcome = process.env.HEALTH_OUTCOME;
            const title = `[AI News Health] Missing report ${date}`;
            const reportUrl = `${process.env.SITE_BASE_URL}/${date}/`;
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100,
              }
            );
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title
            );

            if (outcome === "failure") {
              const body = [
                `The daily report for **${date}** is missing or stale.`,
                "",
                `Expected page: ${reportUrl}`,
                `Health workflow: ${runUrl}`,
                "",
                "Check the Daily AI News workflow logs and rerun it if needed.",
              ].join("\n");

              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Recovered: ${reportUrl} passed the health check in ${runUrl}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed",
              });
            }

      - name: Fail unhealthy workflow
        if: steps.health.outcome == 'failure'
        run: exit 1
