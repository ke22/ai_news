<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News — $date</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="/">Today</a>
      <a href="/archive.html">Archive</a>
    </nav>
    <h1>AI News Monitor</h1>
    <p class="date">$date</p>
  </header>

  <main>
    <section class="lang-section" lang="en">
      <h2>English</h2>

      <section class="headlines">
        <h3>Headlines</h3>
        <ul>
$headlines_en
        </ul>
      </section>

      <section class="analysis">
        <h3>Analysis</h3>
        <div class="analysis-body">$analysis_en</div>
      </section>

      <section class="sources">
        <h3>Sources</h3>
        <ul>
$sources_en
        </ul>
      </section>
    </section>

    <hr>

    <section class="lang-section" lang="zh">
      <h2>中文</h2>

      <section class="headlines">
        <h3>頭條新聞</h3>
        <ul>
$headlines_zh
        </ul>
      </section>

      <section class="analysis">
        <h3>分析</h3>
        <div class="analysis-body">$analysis_zh</div>
      </section>

      <section class="sources">
        <h3>來源</h3>
        <ul>
$sources_zh
        </ul>
      </section>
    </section>
  </main>

  <footer>
    <p>Generated by AI News Monitor</p>
  </footer>
</body>
</html>
