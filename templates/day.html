<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Monitor — $date</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-name">AI News Monitor</div>
        <div class="brand-tagline">An Agentic AI Practice</div>

      <nav>
        <a href="/archive.html">← Back</a>
        <a href="/archive.html">Archive</a>

      <div class="lang-toggle">

        <button class="lang-btn" data-lang="zh" onclick="setLang('zh')">ZH</button>

    <main>

          <h3>Analysis</h3>
$analysis_en

        <hr>

        <section class="sources">
          <h3>Sources</h3>
          <ul>
$sources_en

      <section class="zh" id="zh">
        <h2>$date — AI 新聞摘要</h2>

        <section class="headlines">
          <h3>頭條新聞</h3>
          <ul>
$headlines_zh
          </ul>

        <hr>

        <section class="analysis">
          <h3>分析</h3>
$analysis_zh
        </section>

        <hr>

        <section class="sources">
          <h3>來源</h3>
          <ul>

      Generated by AI News Monitor · Designed by Drhhtang
    </footer>

  <script src="/static/main.js"></script>

</html>
